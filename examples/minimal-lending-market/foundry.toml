# minimal-lending-market — Foundry config
#
# Standalone Foundry sub-project: `cd examples/minimal-lending-market && forge
# build && forge test` must work in isolation (spec §T-4 acceptance). Library
# deps (forge-std, hyper-evm-lib, chimera) are shared with the parent at
# `../../lib/` rather than re-installed, so the example tracks the parent's
# pin exactly and a contributor cloning the example as a starter sees the
# same dep set the library was tested against.
#
# `hyperevm-safety/=../../` lets example code import the library as
# `import {HyperCoreOracleGuard} from "hyperevm-safety/src/HyperCoreOracleGuard.sol"`,
# which is the same import line a fork-from-this-example consumer would write
# once they pull the library in via forge install.

[profile.default]
src = "src"
out = "out"
test = "tests"
libs = ["../../lib"]

solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = false

remappings = [
    "forge-std/=../../lib/forge-std/src/",
    "hyperevm-safety/=../../",
]

ffi = false

[fuzz]
runs = 256
